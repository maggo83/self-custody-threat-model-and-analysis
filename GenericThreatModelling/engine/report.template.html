<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Threat analysis</title>
<style>
:root { --r0: #c8e6c9; --r1: #e6ee9c; --r2: #ffe082; --r3: #ffab91; --r4: #ef5350; --na: #eeeeee; --hdr: 86px; --ctlt: 40px; }
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.35 system-ui, sans-serif; color: #222; background: #fafafa; }
header { padding: 10px 16px 0; background: #fff; border-bottom: 1px solid #ccc; position: sticky; top: 0; z-index: 6; }
h1 { font-size: 17px; margin: 0 0 4px; }
.sub { color: #666; margin-bottom: 6px; }
nav { display: flex; gap: 4px; align-items: end; }
nav a { padding: 6px 14px; border: 1px solid #ccc; border-bottom: none; border-radius: 4px 4px 0 0; color: #333; text-decoration: none; background: #eee; }
nav a.on { background: #fafafa; font-weight: 600; position: relative; top: 1px; }
nav .newtab { margin-left: auto; font-size: 11px; color: #666; border: none; background: none; }
main { padding: 0 16px 40px; }
.chip { display: inline-block; min-width: 1.8em; text-align: center; border-radius: 3px; padding: 0 5px; font-weight: 600; }
.r0 { background: var(--r0); } .r1 { background: var(--r1); } .r2 { background: var(--r2); } .r3 { background: var(--r3); } .r4 { background: var(--r4); color: #fff; }
.chip.na { background: var(--na); color: #777; }
.ctl { position: sticky; top: calc(var(--hdr) - 1px); z-index: 5; background: #fafafa; padding: 9px 0 6px; border-bottom: 1px solid #ddd; }
.bar { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.bar label { white-space: nowrap; }
.legend { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 12px; }
.lg { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.lgrows { display: block; }
.lgrows > div { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin: 2px 0; }
input[type=search] { width: 220px; padding: 3px 6px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; background: #fff; border-top: 1px solid #ddd; border-left: 1px solid #ddd; }
th { position: sticky; top: calc(var(--hdr) + var(--ctlt) - 2px); background: #f0f0f0; z-index: 2; text-align: left; font-weight: 600; }
th[data-sort] { cursor: pointer; user-select: none; white-space: nowrap; }
th[data-sort]:hover { background: #e2e2e2; }
th, td { border: 0; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; padding: 3px 6px; vertical-align: top; }
tr.done > td { opacity: .5; }
td.rv { text-align: center; width: 64px; }
td small { display: block; color: #777; font-size: 11px; }
td.rt, td.risk { text-align: center; width: 54px; cursor: help; }
td.risk b { font-size: 16px; display: block; }
td.risk.r4 small { color: #fff; }
td.ex { font-size: 11.5px; min-width: 190px; max-width: 290px; color: #444; }
td.ex div { margin-bottom: 2px; }
mark { background: #ffeb3b; color: inherit; padding: 0 1px; border-radius: 2px; }
.meas { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 11px; border: 1px solid; cursor: help; margin: 1px 0; }
.meas.prevention { background: #e3f2fd; border-color: #1565c0; color: #0d47a1; }
.meas.detection { background: #f3e5f5; border-color: #6a1b9a; color: #4a148c; }
.meas.off { background: #eee; border: 1px dashed #888; color: #777; text-decoration: line-through; }
td small.mnote { display: inline; }
tr.grp td { background: #e8eaf0; font-weight: 600; cursor: pointer; }
tr.cls td { background: #cfd4e4; font-size: 14px; font-weight: 700; }
tr.na td { background: var(--na); color: #888; }
tr.chain td { background: #fcfcf4; font-size: 12px; }
tr.chain ol { margin: 2px 0 2px 18px; padding: 0; }
tbody.collapsed tr:not(.grp) { display: none; }
button { cursor: pointer; font-size: 11px; margin: 1px; }
.hidden { display: none !important; }
#tip { position: fixed; z-index: 50; display: none; background: #fff; border: 1px solid #888; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); padding: 8px 10px; max-width: 380px; font-size: 12px; pointer-events: none; }
#tip table { width: auto; margin-top: 6px; }
#tip th { position: static; background: #f0f0f0; text-align: center; font-weight: 600; }
#tip td, #tip th { padding: 2px 8px; text-align: center; }
#tip td.l { text-align: left; }
#tip tr.cur td, #tip td.cur { box-shadow: inset 0 0 0 3px #000; font-weight: 700; }
#diagramwrap { display: flex; gap: 12px; margin-top: 8px; }
#svgbox { flex: 1; min-width: 0; overflow: auto; background: #fff; border: 1px solid #ccc; }
#panel { width: 330px; background: #fff; border: 1px solid #ccc; padding: 8px; overflow: auto; }
#panel .item { border-top: 1px solid #eee; padding: 4px 0; }
.dgm { display: block; }
.dgm text { font-family: system-ui, sans-serif; pointer-events: none; }
.dgm g.node { cursor: pointer; }
.dgm rect.body { stroke: #78909c; stroke-width: 1; }
.dgm .bag rect.body { stroke-dasharray: 5 3; }
.dgm .hl-t > rect.body { stroke: #d50000; stroke-width: 4; }
.dgm .hl-a > rect.body { stroke: #e65100; stroke-width: 3; stroke-dasharray: 6 3; }
.dgm .hl-w > rect.body { stroke: #0d47a1; stroke-width: 3; }
.dgm .hl-m > rect.body { stroke: #1b5e20; stroke-width: 3; }
.dgm .hl-c > rect.body { stroke: #555; stroke-width: 2; }
.dgm .sel > rect.body { stroke: #000; stroke-width: 3; }
.dgm .dim { opacity: .17; }
.dgm .edge { fill: none; stroke-width: 1.3; opacity: .5; }
.dgm .edge.on { opacity: 1; stroke-width: 2.4; }
.dgm .edge.off { opacity: .05; }
.swatch { display: inline-block; width: 14px; height: 10px; border: 3px solid; background: #fff; }
body.pop { display: flex; flex-direction: column; height: 100vh; }
.poptop { flex: 0 1 auto; max-height: 45vh; overflow: auto; padding: 10px 16px; border-bottom: 1px solid #ccc; background: #fff; }
.poptop h2 { font-size: 16px; margin: 0 0 4px; }
.poptop .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0; }
.poptop .cols > div { background: #fafafa; border: 1px solid #ddd; padding: 6px 8px; }
.poptop .cols b { display: block; margin-bottom: 4px; }
.band { font-weight: 400; color: #555; }
.popbar { flex: none; padding: 6px 16px; background: #fafafa; border-bottom: 1px solid #ddd; }
#svgbox.popbox { flex: 1; min-height: 0; border: none; }
table.mt { margin-bottom: 14px; }
table.acc { border-collapse: collapse; margin: 10px 0; }
table.acc th, table.acc td { border: 1px solid #cfd8dc; padding: 6px 10px; vertical-align: top; text-align: left; min-width: 130px; }
table.acc td { cursor: pointer; }
table.acc th.focusable { cursor: pointer; color: #1565c0; }
table.acc td .ln { display: block; margin: 2px 0; }
table.acc td.ok { background: #e8f5e9; } table.acc td.warn { background: #fff8e1; } table.acc td.bad { background: #ffebee; } table.acc td.none { color: #90a4ae; cursor: default; }
table.acc td small { display: block; color: #546e7a; }
.ovm { color: #6a1b9a; font-size: 11px; margin-left: 2px; cursor: help; }
#ovpop { position: fixed; z-index: 60; background: #fff; border: 1px solid #8e24aa; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); padding: 10px 12px; border-radius: 6px; max-width: 520px; }
#ovpop label { display: block; margin: 6px 0; }
#ovpop .pb { margin-top: 8px; }
#ovpop fieldset.sc { border: 1px solid #ddd; margin: 6px 0; padding: 2px 8px 4px; }
#ovpop fieldset.sc legend { font-size: 11px; color: #666; }
#ovpop fieldset.sc label { margin: 2px 0; }
#fbexport.changed { background: #f3e5f5; border-color: #8e24aa; }
td.rt[data-f] { cursor: pointer; }
.open { color: #c62828; }
.chipov { display: inline-block; background: #fff; border: 1px solid #ce93d8; border-radius: 10px; padding: 0 6px; margin-left: 4px; font-size: 11px; }
.ask { margin: 4px 0; padding: 3px 0; border-top: 1px solid #eee; }
nav #fbexport { margin-left: 8px; font-size: 11px; }
nav label.dm { margin-left: 8px; font-size: 11px; cursor: pointer; }
/* dark mode: invert the page, then invert pictures back */
html.dark { filter: invert(1) hue-rotate(180deg); background: #fff; }
html.dark img, html.dark svg image { filter: invert(1) hue-rotate(180deg); }
table.mt table.mt { margin: 4px 0; border-top: 1px solid #ddd; }
table.mt summary { cursor: pointer; color: #1565c0; }
table.mt th { top: auto; position: static; }
#view-measures > details > table.mt > tbody > tr:first-child > th { position: sticky; top: calc(var(--hdr) - 1px); }
details.msec { margin: 14px 0; border-left: 8px solid; border-radius: 4px; padding-left: 8px; }
details.msec > summary { cursor: pointer; padding: 6px 0; list-style-position: inside; }
details.msec > summary h3 { display: inline; margin: 0; font-size: 16px; }
details.msec .cnt { color: #555; margin-left: 8px; }
details.have { border-color: #43a047; background: #f3faf3; }
details.miss { border-color: #fb8c00; background: #fff7ea; }
table.mt.have, table.mt.have td { background: #f3faf3; }
table.mt.miss, table.mt.miss td { background: #fff7ea; }
table.mt.have > tbody > tr:first-child > th { background: #c8e6c9; }
table.mt.miss > tbody > tr:first-child > th { background: #ffe0b2; }
table.mt.have tr.pr td { background: #dcedc8; }
table.mt.miss tr.pr td { background: #ffecb3; }
table.mt table.mt td, table.mt table.mt { background: #fff; }
table.mt td { max-width: 460px; }
table.mt tr.pr td { background: #e8eaf0; border-top: 2px solid #b0b6c8; }
table.mt tr.pr td div { font-weight: 400; color: #444; }
ul.steps { margin: 4px 0 4px 16px; padding: 0; }
ul.steps small { display: block; }
</style>
<!--SERVE-->
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <nav id="tabs">
    <a href="#table" data-tab="table">Classic table</a>
    <a href="#diagram" data-tab="diagram">Setup diagram</a>
    <a href="#measures" data-tab="measures">Measures</a>
    <a href="#access" data-tab="access">Access</a>
    <a class="newtab" id="newtab" target="_blank">open this view in a new tab</a>
    <label class="dm" title="Dark colors for the page"><input type="checkbox" id="dark"> dark mode</label>
    <button id="fbexport" title="Save all overrides (ratings set by hand and answers to questions).">save overrides (0)</button>
  </nav>
</header>
<main>
  <section id="view-table">
    <details id="notes"><summary id="notesum"></summary><div id="notebody"></div></details>
    <div class="legend" id="legend"></div>
    <div class="ctl" id="ctl-table">
      <div class="bar">
        <input type="search" id="q" placeholder="search threat, entity, effect">
        <label>risk at least <select id="minrisk"></select></label>
        <label>severity at least <select id="minsev"></select></label>
        <label>class <select id="cls"></select></label>
        <label><input type="checkbox" id="grouped" checked> group by entity</label>
        <label><input type="checkbox" id="explain" checked> explanations</label>
        <label id="nalabel"><input type="checkbox" id="showna"> not applicable</label>
        <label>reviewed <select id="rvfilter"><option value="">all lines</option><option value="open">not reviewed</option><option value="done">reviewed</option></select></label>
        <button id="rvreset" title="Forget which lines you have marked as reviewed">reset reviewed</button>
        <span id="rvcount"></span>
        <span id="count"></span>
      </div>
    </div>
    <div id="tablebox"></div>
  </section>

  <section id="view-diagram" class="hidden">
    <div class="ctl" id="ctl-diagram">
      <div class="bar">
        <label>zoom <input type="range" id="zoom" min="15" max="200" value="100"></label>
        <label>focus <select id="focus"></select></label>
        <label><input type="checkbox" id="links" checked> links</label>
        <label><input type="checkbox" id="riskfill" checked> color by risk</label>
        <span>Drag to move the diagram. Click an entity for its links and threats.</span>
      </div>
      <div class="legend lgrows" id="dlegend"></div>
    </div>
    <div id="diagramwrap"><div id="svgbox"></div><div id="panel">Click an entity.</div></div>
  </section>

  <section id="view-measures" class="hidden"></section>
  <section id="view-access" class="hidden"></section>
</main>
<div id="tip"></div>

<script>
const DATA = __DATA__;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RISK = DATA.texts.risk_labels, CLASSES = DATA.texts.classes;
const COLOR = ['#c8e6c9', '#e6ee9c', '#ffe082', '#ffab91', '#ef5350'];
const chip = v => `<span class="chip r${v}">${v}</span>`;
const plain = xs => xs.map(x => `<div>${esc(x)}</div>`).join('');
const rowById = Object.fromEntries(DATA.rows.map(r => [r.id, r]));
const rowIdx = Object.fromEntries(DATA.rows.map((r, i) => [r.id, i]));
const order = Object.fromEntries(DATA.entities.map((e, i) => [e.id, i]));
const entName = Object.fromEntries(DATA.entities.map(e => [e.id, e.name]));
const rowsOf = {}, maxRisk = {};
for (const r of DATA.rows) for (const e of r.e) {
  (rowsOf[e] = rowsOf[e] || []).push(r);
  maxRisk[e] = Math.max(maxRisk[e] ?? 0, r.R);
}
const byRisk = (a, b) => b.R - a.R || b.S.v - a.S.v || b.L.v - a.L.v || a.t.localeCompare(b.t);

// ---------------------------------------------------------------- search highlight
let MARK = null;
function H(s) {
  s = String(s);
  if (!MARK) return esc(s);
  let out = '', last = 0;
  for (const m of s.matchAll(MARK)) { out += esc(s.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; last = m.index + m[0].length; }
  return out + esc(s.slice(last));
}
const lines = xs => xs.map(x => `<div>${H(x)}</div>`).join('');

// ---------------------------------------------------------------- vulnerability with its measures
function measure(m, tip) {
  const cls = m.note && m.strength === 0 ? 'off' : m.kind;
  const attr = tip ? `data-tip="${tip}"` : `title="${esc(m.name + ': ' + m.desc)}"`;
  return `<div><span class="meas ${cls}" ${attr}>${H(m.name)}</span> <small class="mnote">${esc(m.effect)}; ${m.note ? esc(m.note) : 'protection ' + m.strength}</small></div>`;
}
function vulnHtml(r, withTips) {
  const V = r.V;
  const extra = ovLines(r, 'V');
  return lines(V.pre) + V.m.map((m, i) => measure(m, withTips ? `meas:${rowIdx[r.id]}:${i}` : '')).join('') + (extra.length ? lines(extra) : `<div>${H(V.res)}</div>`);
}

// ---------------------------------------------------------------- explanations on hover
const SCALE_TITLE = { likelihood: 'Likelihood', vulnerability: 'Vulnerability', severity: 'Severity' };
function scaleTip(name, v) {
  const s = DATA.scales[name];
  return `<b>${SCALE_TITLE[name]}</b><div>${esc(s.description)}</div><table>`
    + s.bands.map((b, i) => `<tr class="${i === v ? 'cur' : ''}"><td class="r${i}">${i}</td><td class="l">${esc(b)}</td></tr>`).join('') + '</table>';
}
function riskTip(rl, s, R, L, V) {
  const m = DATA.risk_matrix, known = rl !== '';
  let t = `<b>Risk</b><div>The risk is read from a table: the residual likelihood (${esc(DATA.residual)}) against the severity.</div>`;
  if (known) t += `<div>Here: likelihood ${L} + vulnerability ${V} - 4 = residual likelihood ${rl}; severity ${s}; risk ${R} (${RISK[R]}).</div>`;
  t += '<table><tr><th>residual<br>likelihood</th><th colspan="5">severity</th></tr><tr><th></th>' + [0, 1, 2, 3, 4].map(i => `<th>${i}</th>`).join('') + '</tr>';
  for (let r = 4; r >= 0; r--) {
    t += `<tr><th>${r}</th>` + [0, 1, 2, 3, 4].map(c => `<td class="r${m[r][c]}${known && r === +rl && c === +s ? ' cur' : ''}">${m[r][c]}</td>`).join('') + '</tr>';
  }
  return t + '</table>';
}
function measureTip(ri, i) {
  const m = DATA.rows[+ri].V.m[+i];
  return `<b>${esc(m.name)}</b> <i>(${m.kind})</i><div>${esc(m.desc)}</div><div>${esc(m.effect)}; acts on: ${esc(m.entities)}</div><div>${m.note ? esc(m.note) : 'protection ' + m.strength}</div>`;
}
function tipHtml(key) {
  const [kind, a, b, c, d, e] = key.split(':');
  if (kind === 'scale') return scaleTip(a, b === '' ? -1 : +b);
  if (kind === 'meas') return measureTip(a, b);
  return riskTip(a, b, c, d, e);
}
const tip = $('#tip');
function placeTip(ev) {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = innerHeight - h - 8;
  tip.style.left = Math.max(4, x) + 'px';
  tip.style.top = Math.max(4, y) + 'px';
}
document.addEventListener('mouseover', ev => {
  const el = ev.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  if (tip.dataset.key !== el.dataset.tip) { tip.innerHTML = tipHtml(el.dataset.tip); tip.dataset.key = el.dataset.tip; }
  tip.style.display = 'block';
  placeTip(ev);
});
document.addEventListener('mousemove', ev => { if (tip.style.display === 'block') placeTip(ev); });

// ---------------------------------------------------------------- table
const RV_KEY = 'threat-analysis-reviewed:' + DATA.meta.setup_sha;
let REVIEWED = new Set();
try { REVIEWED = new Set(JSON.parse(localStorage.getItem(RV_KEY) || '[]')); } catch (e) { /* no storage: reviewed marks last for this page only */ }
const saveReviewed = () => { try { localStorage.setItem(RV_KEY, JSON.stringify([...REVIEWED])); } catch (e) { /* ignore */ } };
const state = { col: 'entity', dir: 1 };
const NUMERIC = ['L', 'V', 'S', 'R'];
const KEY = { entity: r => order[r.e[0]], threat: r => r.tn.toLowerCase(), effect: r => r.eff.toLowerCase(), L: r => r.L.v, V: r => r.V.v, S: r => r.S.v, R: r => r.R };
function cmp(a, b) {
  if (a.na !== b.na && NUMERIC.includes(state.col)) return a.na ? 1 : -1;
  const x = KEY[state.col](a), y = KEY[state.col](b);
  return (x < y ? -1 : x > y ? 1 : 0) * state.dir
    || order[a.e[0]] - order[b.e[0]] || a.tn.localeCompare(b.tn) || a.eff.localeCompare(b.eff);
}
const DARK_KEY = 'threat-analysis-dark';
function setDark(on) {
  document.documentElement.classList.toggle('dark', on);
  $('#dark').checked = on;
  try { localStorage.setItem(DARK_KEY, on ? '1' : '0'); } catch (e) { /* no storage */ }
}
// ---------------------------------------------------------------- overrides: ratings set by hand and answers to questions
// One mechanism for both: an override names a line (row + field, the final value) or a question (ask, the base likelihood).
// What changes here stays in this browser until it is exported; `threat_analysis.py ... --feedback FILE` writes it into the analysis.
const FB_KEY = 'threat-analysis-overrides:' + DATA.meta.setup_sha;
let CHANGES = {};   // key -> override, or null where one that is in the analysis was removed
try { CHANGES = JSON.parse(localStorage.getItem(FB_KEY) || '{}'); } catch (e) { /* no storage */ }
const saveFb = () => { try { localStorage.setItem(FB_KEY, JSON.stringify(CHANGES)); } catch (e) { /* ignore */ } };
const SCOPES = ['row', 'threat', 'entity', 'ask'];
const scopeOf = o => SCOPES.find(k => k in o);
const okey = o => { const k = scopeOf(o); return `${k}|${o[k]}|${o.field || 'L'}`; };
// the override that rates a line: the line itself, else its threat on all entities, else one of its entities (all its threats)
const pickOv = (cur, r, f) => cur.get(`row|${r.id}|${f}`) || cur.get(`threat|${r.t}|${f}`) || r.e.map(e => cur.get(`entity|${e}|${f}`)).find(Boolean) || null;
const OPENED = new Set();
const FIELD_NAME = { L: 'likelihood', V: 'vulnerability', S: 'severity' };
const clampv = v => Math.max(0, Math.min(4, v));
function currentOverrides() {
  const m = new Map(DATA.overrides.map(o => [okey(o), o]));
  for (const [k, v] of Object.entries(CHANGES)) { if (v === null) m.delete(k); else m.set(k, v); }
  return m;
}
function recompute() {
  const cur = currentOverrides();
  for (const r of DATA.rows) {
    const L0 = clampv(r.L.cb + r.L.mod), rowL = pickOv(cur, r, 'L'), ask = r.L.ask ? cur.get(`ask|${r.L.ask}|L`) : null;
    const viaAsk = ask ? clampv(ask.value + r.L.mod) : L0;
    r.L.v = rowL ? rowL.value : viaAsk;
    r.L.src = rowL ? { kind: scopeOf(rowL), o: rowL, c: viaAsk } : ask ? { kind: 'ask', o: ask, c: L0 } : null;
    for (const f of ['V', 'S']) {
      const o = pickOv(cur, r, f);
      r[f].v = o ? o.value : r[f].c;
      r[f].src = o ? { kind: scopeOf(o), o, c: r[f].c } : null;
    }
    r.RL = clampv(r.L.v + r.V.v - 4);
    r.R = DATA.risk_matrix[r.RL][r.S.v];
  }
  for (const e in maxRisk) delete maxRisk[e];
  for (const r of DATA.rows) for (const e of r.e) maxRisk[e] = Math.max(maxRisk[e] ?? 0, r.R);
  const n = Object.keys(CHANGES).length;
  $('#fbexport').textContent = `save overrides (${cur.size})`;
  $('#fbexport').title = window.SERVE
    ? `Writes all overrides into ${window.SERVE.file}, runs the analysis again and reloads the report.`
    : 'Downloads all overrides as overrides.json (this page is a file and cannot write next to the analysis). Then run threat_analysis.py SETUP -o ANALYSIS --feedback overrides.json --html to write them into the analysis file, or start the tool with --serve to save from the page.';
  $('#fbexport').classList.toggle('changed', n > 0);
}
// the explanation of a rating, with the reason of an override when there is one
const SCALE_OF = { L: 'likelihood', V: 'vulnerability', S: 'severity' };
// who an override applies to, in words

    box.scrollTop = down.t - dy;
  });
  window.addEventListener('mouseup', () => { down = null; box.style.cursor = 'grab'; });
  box.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);

    + lines(m.lines, 'lines that depend on it') + (m.extend.length ? `<div>Covering everything it applies to: ${effect(m.extend, false)}.</div>` + lines(m.extend, 'lines it would improve') : '') + '</td></tr>';
  const missRow = m => `<tr><td>${head(m)}</td><td>${what(m)}</td><td>${set(m.applicable, '')}<small>against: ${esc(m.addresses.join(', '))}</small></td>`
    + `<td>${m.lines.length ? `Would make ${effect(m.lines, false)}.` : 'Would not change any line in the current rating.'}`
    + lines(m.lines, 'lines it would improve') + '</td></tr>';
  // measures that refine the same principle are shown together under it
  const section = (title, list, order, row, cols, kind) => {
    const groups = new Map();
    for (const m of list) {
      const key = m.group ? m.group.id : '';
      if (!groups.has(key)) groups.set(key, { g: m.group, items: [] });
      groups.get(key).items.push(m);
    }
    const body = [...groups.values()].sort((a, b) => (a.g ? 0 : 1) - (b.g ? 0 : 1) || (a.g ? a.g.name.localeCompare(b.g.name) : 0)).map(x =>
      `<tr class="pr"><td colspan="4"><b>${x.g ? esc(x.g.name) : 'Other measures'}</b>${x.g ? `<div>${esc(x.g.desc)}</div>` : ''}</td></tr>` + x.items.sort(order).map(row).join('')).join('');
    return `<details open class="msec ${kind}"><summary><h3>${title}</h3> <span class="cnt">${list.length} measures</span></summary><table class="mt ${kind}"><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr>${body}</table></details>`;
  };
  const have = DATA.measures.filter(m => m.inplace), miss = DATA.measures.filter(m => !m.inplace);
  $('#view-measures').innerHTML = section('Procedures in place', have, (a, b) => b.lines.length - a.lines.length || a.name.localeCompare(b.name), haveRow,
    ['measure', 'what to do', 'applies to', 'what it is worth'], 'have')
    + section('Procedures not in place that apply to this setup', miss, (a, b) => gain(b) - gain(a) || a.name.localeCompare(b.name), missRow,
    ['measure', 'what to do', 'would apply to', 'what it would add'], 'miss');
}
function sticky() {
  const root = document.documentElement.style;
  root.setProperty('--hdr', $('header').getBoundingClientRect().height + 'px');
  root.setProperty('--ctlt', ($('#ctl-table').getBoundingClientRect().height || 40) + 'px');
  const wrap = $('#diagramwrap');
  if (!$('#view-diagram').classList.contains('hidden')) {
    const top = $('header').getBoundingClientRect().height + $('#ctl-diagram').getBoundingClientRect().height + 8;
    wrap.style.height = Math.max(200, innerHeight - top - 16) + 'px';
  }
}
// People against wallets: the rights they should have, what the intact setup gives them, and what threats do to it.
function accessView() {
  const R = DATA.rights, people = ST.nodes.filter(n => n.c === 'Person'), nm = id => entName[id] || id;
  const after = n => n === 0 ? 'at once' : `after ${n} blocks (about ${Math.max(1, Math.round(n / 144))} days)`;
  const who = (ids, me) => { const o = ids.filter(i => i !== me); return o.length ? 'with ' + o.map(nm).join(' and ') : 'alone'; };
  const used = new Set([...R.rights.map(r => r.wallet), ...R.extra.map(r => r.wallet), ...R.threats.map(t => t.wallet)]);
  const wallets = ST.nodes.filter(n => n.c === 'Wallet' && (used.has(n.id) || !n.tripwire));
  const cell = (p, w) => {
    const out = [];
    let level = 0;
    for (const r of R.rights.filter(r => r.wallet === w.id && r.people.includes(p.id))) {
      const how = { ok: 'delivered', later: `only ${after(r.got)}`, never: 'cannot be used at all', earlier: `already ${after(r.got)}` }[r.state];
      out.push(`<span class="ln">${esc(who(r.people, p.id))}, ${esc(after(r.after))}: <b>${esc(how)}</b></span>`);
      level = Math.max(level, r.state === 'ok' ? 1 : r.state === 'earlier' ? 2 : 3);
    }
    for (const r of R.extra.filter(r => r.wallet === w.id && r.people.includes(p.id))) {
      out.push(`<span class="ln">can spend ${esc(who(r.people, p.id))}, ${esc(after(r.got))}, <b>without having that right</b></span>`);
      level = Math.max(level, 3);
    }
    const t = R.threats.find(t => t.person === p.id && t.wallet === w.id);
    if (!out.length) return '<td class="none">&ndash;</td>';
    if (t) out.push(`<small>${t.lost ? `${t.lost} threats take it away` : ''}${t.lost && t.delayed ? ', ' : ''}${t.delayed ? `${t.delayed} delay it` : ''}</small>`);
    return `<td class="${['none', 'ok', 'warn', 'bad'][level]}" data-person="${esc(p.id)}" data-wallet="${esc(w.id)}">${out.join('')}</td>`;
  };
  const notes = DATA.warnings.filter(x => x.startsWith('rights:'));
  $('#view-access').innerHTML = '<p>What each person should be able to spend (the rights of the setup) against what the intact setup gives them. Click a cell or a name to see it in the setup diagram.</p>'
    + `<table class="acc"><tr><th></th>${wallets.map(w => `<th class="focusable" data-focus="${esc(w.id)}">${esc(w.name)}</th>`).join('')}</tr>`
    + people.map(p => `<tr><th class="focusable" data-focus="${esc(p.id)}">${esc(p.name)}</th>${wallets.map(w => cell(p, w)).join('')}</tr>`).join('') + '</table>'
    + (notes.length ? '<h3>Findings</h3><ul>' + notes.map(x => `<li>${esc(x.slice(8))}</li>`).join('') + '</ul>' : '<p>The intact setup gives everybody exactly the access that was intended.</p>');
}
$('#view-access').addEventListener('click', ev => {
  const t = ev.target.closest('[data-focus], td[data-person]');
  if (!t) return;
  show('diagram');
  location.hash = '#diagram';
  const id = t.dataset.focus || t.dataset.person;
  setFocus(id);
  SEL = id;
  showEntity(SEL);
  drawMain();
});
function show(tab) {
  if (!['table', 'diagram', 'measures', 'access'].includes(tab)) tab = 'table';
  for (const t of ['table', 'diagram', 'measures', 'access']) $('#view-' + t).classList.toggle('hidden', t !== tab);
  document.querySelectorAll('nav a[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  $('#newtab').href = '#' + tab;
  if (tab === 'diagram') diagramView(); else if (tab === 'measures') measuresView(); else if (tab === 'access') accessView(); else sticky();
}
function stats() {
  const m = DATA.meta, dist = [4, 3, 2, 1, 0].map(i => `${chip(i)} ${DATA.rows.filter(r => r.R === i).length}`).join(' ');
  $('#sub').innerHTML = `${DATA.rows.length} lines, ${DATA.na.length} not applicable, generated ${esc(m.generated)} (setup ${esc(m.setup_sha)}). Risk: ${dist}`;
}
function init() {
  const m = DATA.meta;
  $('#title').textContent = `Threat analysis: ${m.setup}`;
  recompute(); stats();
  $('#notesum').textContent = `${DATA.asks.length} questions for the owner, ${DATA.warnings.length} warnings`;
  $('#notebody').innerHTML = notesHtml();
  $('#fbexport').addEventListener('click', exportFb);
  $('#dark').addEventListener('input', ev => setDark(ev.target.checked));
  let wanted = null;
  try { wanted = localStorage.getItem(DARK_KEY); } catch (e) { /* no storage */ }
  setDark(wanted === null ? matchMedia('(prefers-color-scheme: dark)').matches : wanted === '1');
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
  const opt = (v, t) => `<option value="${v}">${t}</option>`;
  $('#minrisk').innerHTML = [0, 1, 2, 3, 4].map(i => opt(i, `${i} ${RISK[i]}`)).join('');
  $('#minsev').innerHTML = [0, 1, 2, 3, 4].map(i => `<option value="${i}" title="${esc(DATA.scales.severity.bands[i])}">${i} ${esc(DATA.scales.severity.bands[i].split(/[,;]| or /)[0])}</option>`).join('');
  const used = new Set(DATA.rows.map(r => r.c));
  $('#cls').innerHTML = opt('', 'all') + DATA.entities.map(e => e.class).filter((c, i, a) => a.indexOf(c) === i && used.has(c)).map(c => opt(c, CLASSES[c][1])).join('');
  const of = c => ST.nodes.filter(n => n.c === c).map(n => opt(n.id, esc(n.name))).join('');
  const policyOptions = ST.nodes.filter(n => n.c === 'Wallet' && n.policies.length > 1).map(n => n.policies.map((t, i) => opt(`${n.id}#${i + 1}`, esc(`${n.name}: ${t}`))).join('')).join('');
  $('#focus').innerHTML = opt('', 'nothing') + `<optgroup label="what a person can reach">${of('Person')}</optgroup><optgroup label="what a wallet depends on">${of('Wallet')}</optgroup>`
    + (policyOptions ? `<optgroup label="what one spending policy depends on">${policyOptions}</optgroup>` : '');
  for (const id of ['q', 'minrisk', 'minsev', 'cls', 'grouped', 'explain', 'showna', 'rvfilter']) $('#' + id).addEventListener('input', tableView);
  $('#rvreset').addEventListener('click', () => { if (REVIEWED.size && confirm('Forget all reviewed marks?')) { REVIEWED.clear(); saveReviewed(); tableView(); } });
  $('#tablebox').addEventListener('change', ev => {
    const id = ev.target.dataset && ev.target.dataset.rv;
    if (!id) return;
    if (ev.target.checked) REVIEWED.add(id); else REVIEWED.delete(id);
    saveReviewed();
    if ($('#rvfilter').value) tableView();
    else { ev.target.closest('tr').classList.toggle('done', ev.target.checked); $('#rvcount').textContent = `${REVIEWED.size} of ${DATA.rows.length} lines reviewed`; }
  });
  legend(); tableView();
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  window.addEventListener('resize', sticky);
  show(location.hash.slice(1));
}
init();
</script>
